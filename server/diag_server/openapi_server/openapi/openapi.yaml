          description: Metadata of object
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JsonProblem'
          description: The request caused an unexpected error.
      tags:
      - Objects
      x-openapi-router-controller: diag_server.openapi_server.controllers.objects_controller
  /diagnostic-data-sets/{diag-data-set-id}/objects/{perma-id}:
