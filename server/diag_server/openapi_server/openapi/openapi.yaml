openapi: 3.0.3
info:
  contact:
    name: odex.viewer Team
    url: https://github.com/mercedes-benz/odex.viewer
  description: API documentation of the RESTful HTTP API of the odex.viewer backend
    server to interact with ODX-based diagnostic data.
  title: RESTful HTTP API documentation of the odex.viewer backend server
  version: "1.0"
servers:
- url: http://localhost:8080/v1
tags:
- description: "Methods for managing diagnostic data sets known to the server, e.g.,\
    \ adding or removing PDX files."
  name: Diagnostic Data Set
- description: Methods for requesting objects and their metadata from the server.
  name: Objects
- description: Methods for retrieving structured data using OpenAPI Schema type names.
  name: Structured Data Retrieval
- description: Methods for requesting diagnostic variants from a diagnostic data set
    of the server.
  name: Diagnostic Variants
- description: Methods for requesting the revision history of documents or variants.
  name: Revision History
- description: Methods for requesting diagnostic communication definitions.
  name: Diagnostic Communications
- description: Methods for requesting diagnostic trouble code (DTC) definitions.
  name: Diagnostic Trouble Codes
- description: Methods for requesting data object property (DOP) definitions.
  name: Data Object Properties
- description: Methods for requesting state chart definitions.
  name: State Charts
paths:
  /diag-comms:
    get:
      description: Returns all diagnostic communications from all existing BASE-VARIANT
        or ECU-VARIANT objects in all diagnostic data sets.
      operationId: get_all_diag_comms_from_all_diagnostic_data_sets
      parameters:
      - description: "Filters the returned objects based on the list of given fields,\
          \ i.e., only the fields specified are part of the object representation\
          \ in the respone. Only the identification field, i.e. the perma_id and ephemeral_id\
          \ are always returned for any object."
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagCommsOfVariantsOfDataSetsCollection'
          description: The collection of all diag comms
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JsonProblem'
          description: The request caused an unexpected error.
      tags:
      - Diagnostic Communications
      x-openapi-router-controller: diag_server.openapi_server.controllers.diagnostic_communications_controller
  /diagnostic-data-sets:
    get:
      description: Returns the collection of diagnostic data types of the server.
      operationId: get_diagnostic_data_types
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                - PDX
              schema:
                $ref: '#/components/schemas/DiagnosticDataTypeCollection'
          description: Collection of diagnostic data set resources of the server.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JsonProblem'
          description: The request caused an unexpected error.
      tags:
      - Diagnostic Data Set
      x-openapi-router-controller: diag_server.openapi_server.controllers.diagnostic_data_set_controller
  /diagnostic-data-sets/{data-type}:
    delete:
      description: Deletes all diagnostic data set for the specified data type of
        the server.
      operationId: delete_all_diagnostic_data_from_type
      parameters:
      - description: The type of diagnostic data to fetch
        explode: false
        in: path
        name: data-type
        required: true
        schema:
          $ref: '#/components/schemas/DiagnosticDataType'
        style: simple
      responses:
        "204":
          description: Diagnostic data set resources are successfully deleted.
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JsonProblem'
          description: The request caused an unexpected error.
      tags:
      - Diagnostic Data Set
      x-openapi-router-controller: diag_server.openapi_server.controllers.diagnostic_data_set_controller
    get:
      description: Returns the collection of diagnostic data descriptors of a specific
        type of diagnostic data set of the Server
      operationId: get_diagnostic_data_collection_of_type
      parameters:
      - description: The type of diagnostic data to fetch
        explode: false
        in: path
        name: data-type
        required: true
        schema:
          $ref: '#/components/schemas/DiagnosticDataType'
        style: simple
      responses:
        "200":
          content:
            application/json:
              example:
                items:
                - perma_id: pdx-a
                  display_name: PDX of ECU-A
                  file_name: ecu-a.pdx
                  version: 1.0.0
                  diagnostic_layer_containers:
                  - perma_id: dlc-1
                    ephemeral_id: 123
                    short_name: somersault
                    isMainContainer: true
              schema:
                $ref: '#/components/schemas/DiagnosticDataCollection'
          description: Selected collection of diagnostic data set of the Server
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JsonProblem'
          description: The request caused an unexpected error.
      tags:
      - Diagnostic Data Set
      x-openapi-router-controller: diag_server.openapi_server.controllers.diagnostic_data_set_controller
    post:
      description: Upload diagnostic data set to the server.
      operationId: upload_diagnostic_data_to_server
      parameters:
      - description: The type of diagnostic data to fetch
        explode: false
        in: path
        name: data-type
        required: true
        schema:
          $ref: '#/components/schemas/DiagnosticDataType'
        style: simple
      requestBody:
        content:
          multipart/form-data:
            encoding:
              metadata:
                contentType: application/json
                style: form
              file_content:
                contentType: application/octet-stream
                style: form
            schema:
              $ref: '#/components/schemas/uploadDiagnosticDataToServer_request'
      responses:
        "201":
          content:
            application/json:
              example:
                id: 7ab52f10-5ea9-4610-a1de-c414c8265ce4
              schema:
                $ref: '#/components/schemas/CreatedResourceReference'
          description: A new resource was created.
          headers:
            Location:
              $ref: '#/components/headers/LocationHeader'
        default:
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/JsonProblem'
          description: The request caused an unexpected error.
      tags:
      - Diagnostic Data Set
      x-codegen-request-body-name: diagnostic_data_request
      x-openapi-router-controller: diag_server.openapi_server.controllers.diagnostic_data_set_controller
  /diagnostic-data-sets/{data-type}/{diag-data-set-id}:
    delete:
      description: Deletes a specific diagnostic data set resource from the specified
        data type of the server.
      operationId: delete_diagnostic_data_from_type
      parameters:
      - description: The type of diagnostic data to fetch
        explode: false
        in: path
        name: data-type
        required: true
        schema:
          $ref: '#/components/schemas/DiagnosticDataType'
        style: simple
      - description: ID of the diagnostic data set to fetch
        explode: false
        in: path
        name: diag-data-set-id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Diagnostic data set resource is successfully deleted.
        default:
          content:
            application/problem+json:
              schema:
