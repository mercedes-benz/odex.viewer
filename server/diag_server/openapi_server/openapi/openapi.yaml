          description: The request caused an unexpected error.
      tags:
      - Diagnostic Data Set
      x-openapi-router-controller: diag_server.openapi_server.controllers.diagnostic_data_set_controller
  /diagnostic-data-sets/{diag-data-set-id}/metadata/{perma-id}:
    get:
      description: Returns metadata for the given object.
      operationId: get_metadata_by_perma_id_from_diagnostic_data_set
      parameters:
